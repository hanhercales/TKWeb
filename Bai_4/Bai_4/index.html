<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="https://youtu.be/dQw4w9WgXcQ?si=ljUGFa_oHo_K3n6V">
        <p><label>Username:</label>
        <input type="text" name="username" required></p>
        <p><label>Password:</label>
        <input type="password" name="password" required></p>
        <p><label>Confirm password:</label>
        <input type="password" name="cfpw" required></p>
        <p><label>First Name:</label>
        <input type="text" name="first_name" required></p>
        <p><label>Last Name:</label>
        <input type="text" name="last_name" required></p>
        <p><label>Date of Birth:</label>
        <input type="date" name="age" required></p>
        <p><label>Gender:</label>
        <input type="radio" name="gender" required> Male
        <input type="radio" name="gender" required> Female </p>
        <p><label>Email:</label>
        <input type="text" name="email" required></p>
        <p><label>Phone Number:</label>
        <input type="text" name="number" required></p>
        <p><label>Region:</label>
        <select name="region" required>
            <option value="blank"></option>
            <option value="vn">Vietnam</option>
            <option value="us">USA</option>
            <option value="ru">Russia</option>
            <option value="jp">Japan</option>
        </select></p>
        <p><label>Address:</label>
        <input type="" name="address" required></p>
        <p><button>Sign Up</button></p>
    </form>
    <script src="script.js"></script>
</body>
</html>
